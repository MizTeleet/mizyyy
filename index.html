<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поиск фильмов</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Поиск фильма</h1>
        <p class="subtitle">Введите название, и мы найдём фильмы через API ПоискКино.</p>

        <label for="searchInput" class="label">Название фильма</label>
        <input id="searchInput" type="text" placeholder="Например, Интерстеллар" autocomplete="off" />

        <div class="status-row">
          <span id="status" class="status">Начните вводить название фильма…</span>
        </div>

        <ul id="results" class="results" aria-live="polite"></ul>

        <button id="loadMoreBtn" class="load-more hidden" type="button">Показать ещё</button>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
