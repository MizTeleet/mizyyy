<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeetFilms</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <main class="app-shell">
      <header class="app-header glass">
        <div>
          <h1>LeetFilms</h1>
          <p class="subtitle">Введите название</p>
        </div>
        <nav class="tabs" aria-label="Разделы приложения">
          <button class="tab-btn active" data-tab="search">Поиск</button>
          <button class="tab-btn" data-tab="favorites">Избранное</button>
          <button class="tab-btn" data-tab="me">Моё</button>
        </nav>
      </header>

      <section id="tab-search" class="tab-view active glass">
        <label for="searchInput" class="label">Название фильма</label>
        <input id="searchInput" type="text" placeholder="Например, Интерстеллар" autocomplete="off" />
        <div class="status-row"><span id="status" class="status">Начните поиск фильма…</span></div>
        <ul id="results" class="results" aria-live="polite"></ul>
        <button id="loadMoreBtn" class="load-more hidden" type="button">Показать ещё</button>
      </section>

      <section id="tab-favorites" class="tab-view glass">
        <div class="section-title-row">
          <h2>Избранное</h2>
          <span id="favoritesCount" class="counter">0 фильмов</span>
        </div>
        <ul id="favoritesList" class="results"></ul>
      </section>

      <section id="tab-me" class="tab-view glass">
        <div class="section-title-row">
          <h2>Моё</h2>
          <button id="newNoteBtn" class="chip-btn" type="button">+ Новая заметка</button>
        </div>
        <div id="notesList" class="notes-list"></div>
      </section>
    </main>

    <div id="detailsOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Подробнее о фильме">
      <div id="detailsModal" class="modal glass">
        <button id="closeModalBtn" class="close-btn" type="button">✖</button>
        <section id="movieDetails" class="movie-details"></section>
      </div>
    </div>

    <template id="noteTemplate">
      <article class="note-card">
        <input class="note-title" type="text" maxlength="120" placeholder="Заголовок" />
        <textarea class="note-content" rows="5" placeholder="Ваша заметка..."></textarea>
        <div class="note-actions">
          <span class="note-date"></span>
          <div>
            <button class="chip-btn save-note" type="button">Сохранить</button>
            <button class="chip-btn ghost delete-note" type="button">Удалить</button>
          </div>
        </div>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
